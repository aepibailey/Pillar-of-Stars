<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03030a"/>
      <stop offset="100%" stop-color="#0a0716"/>
    </linearGradient>
    <linearGradient id="column" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,220,150,0)"/>
      <stop offset="35%" stop-color="rgba(255,224,160,0.28)"/>
      <stop offset="50%" stop-color="rgba(255,238,200,0.6)"/>
      <stop offset="65%" stop-color="rgba(255,224,160,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,220,150,0)"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(120,80,200,0)"/>
      <stop offset="50%" stop-color="rgba(150,110,230,0.22)"/>
      <stop offset="100%" stop-color="rgba(120,80,200,0)"/>
    </linearGradient>
    <radialGradient id="coreheart" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6dd"/>
      <stop offset="45%" stop-color="rgba(255,224,150,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,200,120,0)"/>
    </radialGradient>
    <filter id="wide"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="390" height="520" fill="url(#deep)"/>

  <!-- field stars -->
  <g fill="#b9c4e8" opacity="0.8">
    <circle cx="30" cy="60" r="1"/><circle cx="70" cy="140" r="0.8"/><circle cx="44" cy="250" r="1.1"/>
    <circle cx="60" cy="380" r="0.9"/><circle cx="24" cy="470" r="0.8"/><circle cx="352" cy="80" r="1"/>
    <circle cx="330" cy="200" r="0.9"/><circle cx="356" cy="320" r="1.1"/><circle cx="336" cy="440" r="0.8"/>
    <circle cx="100" cy="40" r="0.7"/><circle cx="300" cy="30" r="0.8"/><circle cx="90" cy="480" r="1"/>
  </g>

  <!-- the pillar: violet haze, then the burning column -->
  <rect x="55" y="0" width="280" height="520" fill="url(#violet)" filter="url(#wide)"/>
  <rect x="105" y="0" width="180" height="520" fill="url(#column)"/>
  <ellipse cx="195" cy="235" rx="70" ry="130" fill="url(#coreheart)" filter="url(#wide)"/>

  <!-- dust lanes crossing the column -->
  <g fill="#0d0a18" opacity="0.55" filter="url(#wide)">
    <ellipse cx="180" cy="150" rx="90" ry="9" transform="rotate(-7 180 150)"/>
    <ellipse cx="210" cy="330" rx="100" ry="11" transform="rotate(5 210 330)"/>
    <ellipse cx="188" cy="430" rx="80" ry="8" transform="rotate(-4 188 430)"/>
  </g>

  <!-- dense core stars, thickest along the axis -->
  <g fill="#fff3d6">
    <circle cx="192" cy="90" r="1.1"/><circle cx="205" cy="120" r="0.8"/><circle cx="182" cy="140" r="1.3"/>
    <circle cx="198" cy="168" r="0.9"/><circle cx="214" cy="188" r="1.1"/><circle cx="176" cy="205" r="0.8"/>
    <circle cx="195" cy="228" r="1.4"/><circle cx="208" cy="252" r="1"/><circle cx="184" cy="272" r="1.2"/>
    <circle cx="199" cy="298" r="0.9"/><circle cx="212" cy="318" r="1.1"/><circle cx="180" cy="342" r="0.8"/>
    <circle cx="194" cy="368" r="1.2"/><circle cx="206" cy="392" r="0.9"/><circle cx="186" cy="415" r="1.1"/>
    <circle cx="198" cy="445" r="1"/><circle cx="190" cy="475" r="0.9"/><circle cx="204" cy="500" r="1.1"/>
    <circle cx="160" cy="110" r="0.8"/><circle cx="232" cy="140" r="0.7"/><circle cx="150" cy="190" r="0.9"/>
    <circle cx="240" cy="215" r="0.8"/><circle cx="148" cy="260" r="0.7"/><circle cx="238" cy="290" r="0.9"/>
    <circle cx="154" cy="330" r="0.8"/><circle cx="234" cy="360" r="0.7"/><circle cx="158" cy="400" r="0.9"/>
    <circle cx="228" cy="430" r="0.8"/><circle cx="132" cy="150" r="0.6"/><circle cx="256" cy="180" r="0.6"/>
    <circle cx="126" cy="300" r="0.6"/><circle cx="260" cy="330" r="0.6"/><circle cx="130" cy="420" r="0.6"/>
    <circle cx="254" cy="80" r="0.6"/><circle cx="140" cy="60" r="0.6"/><circle cx="246" cy="460" r="0.7"/>
  </g>

  <!-- one small ship, prow toward the light -->
  <g transform="translate(88,452) rotate(-52)">
    <polygon points="0,3 16,0 20,3 16,6" fill="#39415c"/>
    <line x1="-14" y1="3" x2="-2" y2="3" stroke="#7ea8ff" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
