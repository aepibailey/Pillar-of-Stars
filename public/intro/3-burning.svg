<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#170604"/>
      <stop offset="55%" stop-color="#571b08"/>
      <stop offset="85%" stop-color="#c65a17"/>
      <stop offset="100%" stop-color="#f0a13e"/>
    </linearGradient>
    <radialGradient id="blaze" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="rgba(255,190,90,0.95)"/>
      <stop offset="45%" stop-color="rgba(240,110,40,0.55)"/>
      <stop offset="100%" stop-color="rgba(150,40,10,0)"/>
    </radialGradient>
    <filter id="smoke"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="fire"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="runner">
      <circle cx="5" cy="2.6" r="2.6"/>
      <path d="M3.2 5.4 L8.4 6.6 L11.6 12.2 L9.6 13.4 L6.8 8.9 L5.9 12.6 L8.8 18.4 L6.4 19.6 L3.2 13.2 L1 18.8 L-1.4 17.8 L1.4 10.4 L2.2 6.2 Z"/>
      <path d="M7.4 6.4 L12.2 4.2 L13 6 L8.6 8.4 Z"/>
    </g>
  </defs>

  <rect width="390" height="520" fill="url(#sky3)"/>
  <ellipse cx="195" cy="470" rx="290" ry="180" fill="url(#blaze)"/>

  <!-- falling ordnance streaks -->
  <g stroke="#ffd9a0" stroke-width="1.6" opacity="0.85">
    <line x1="96" y1="30" x2="118" y2="132"/>
    <line x1="268" y1="10" x2="286" y2="96"/>
    <line x1="196" y1="52" x2="206" y2="128"/>
  </g>

  <!-- skyline -->
  <g fill="#0a0505">
    <rect x="0" y="330" width="34" height="120"/>
    <rect x="40" y="290" width="30" height="160"/>
    <rect x="76" y="318" width="24" height="132"/>
    <rect x="104" y="252" width="38" height="198"/>
    <rect x="148" y="300" width="26" height="150"/>
    <rect x="180" y="270" width="34" height="180"/>
    <rect x="220" y="312" width="24" height="138"/>
    <rect x="250" y="238" width="40" height="212"/>
    <rect x="296" y="296" width="28" height="154"/>
    <rect x="330" y="326" width="34" height="124"/>
    <polygon points="104,252 123,224 142,252"/>
    <polygon points="250,238 270,206 290,238"/>
  </g>

  <!-- fires inside the city -->
  <g filter="url(#fire)">
    <ellipse cx="122" cy="300" rx="18" ry="30" fill="#ffb347" opacity="0.9"/>
    <ellipse cx="122" cy="288" rx="9" ry="18" fill="#ffe6a8"/>
    <ellipse cx="268" cy="286" rx="20" ry="34" fill="#ff9838" opacity="0.9"/>
    <ellipse cx="268" cy="272" rx="10" ry="18" fill="#ffe2a0"/>
    <ellipse cx="60" cy="340" rx="14" ry="22" fill="#ff8c30" opacity="0.85"/>
    <ellipse cx="196" cy="330" rx="12" ry="20" fill="#ffaf45" opacity="0.85"/>
    <ellipse cx="340" cy="356" rx="14" ry="20" fill="#ff9838" opacity="0.8"/>
  </g>

  <!-- smoke columns -->
  <g fill="#1c1210" opacity="0.75" filter="url(#smoke)">
    <ellipse cx="118" cy="210" rx="26" ry="60"/>
    <ellipse cx="132" cy="130" rx="34" ry="56"/>
    <ellipse cx="272" cy="196" rx="28" ry="62"/>
    <ellipse cx="256" cy="110" rx="38" ry="54"/>
    <ellipse cx="60" cy="270" rx="20" ry="40"/>
  </g>

  <!-- street-level firelight: the bright band the fleeing crowd is silhouetted against -->
  <rect x="0" y="396" width="390" height="56" fill="#e8842c"/>
  <rect x="0" y="396" width="390" height="56" fill="url(#blaze)" opacity="0.6"/>
  <g filter="url(#fire)">
    <ellipse cx="90" cy="424" rx="60" ry="16" fill="#ffcf7d" opacity="0.85"/>
    <ellipse cx="230" cy="428" rx="80" ry="14" fill="#ffb95e" opacity="0.8"/>
    <ellipse cx="340" cy="422" rx="50" ry="15" fill="#ffcf7d" opacity="0.8"/>
  </g>

  <!-- foreground: the road out, and the people on it -->
  <path d="M0 448 L390 436 L390 520 L0 520 Z" fill="#070403"/>
  <g fill="#070403">
    <use href="#runner" transform="translate(58,428) scale(1.15)"/>
    <use href="#runner" transform="translate(96,433) scale(0.95)"/>
    <use href="#runner" transform="translate(148,430) scale(1.25)"/>
    <use href="#runner" transform="translate(206,436) scale(1.05)"/>
    <use href="#runner" transform="translate(252,431) scale(0.9)"/>
    <use href="#runner" transform="translate(298,434) scale(1.2)"/>
    <!-- one carrying a child -->
    <circle cx="190" cy="441" r="2" />
  </g>
</svg>
